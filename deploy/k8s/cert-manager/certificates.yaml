apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: realmucket-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: realmucket-ca
spec:
  isCA: true
  commonName: realmucket-ca
  secretName: realmucket-ca
  privateKey: {algorithm: ECDSA, size: 256}
  issuerRef: {name: realmucket-selfsigned, kind: Issuer}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: realmucket-ca
spec:
  ca:
    secretName: realmucket-ca
---
# One certificate shared by gateway, datanodes and controller; the secret carries tls.crt, tls.key, ca.crt.
# Replace the gateway DNS names with the names your clients dial.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: realmucket-tls
spec:
  secretName: realmucket-tls
  duration: 2160h
  renewBefore: 360h
  privateKey: {algorithm: ECDSA, size: 256}
  usages: [server auth, client auth]
  dnsNames:
    - realmucket-gateway
    - realmucket-gateway.realmucket.svc
    - realmucket-gateway.realmucket.svc.cluster.local
    - "*.realmucket-datanode.realmucket.svc"
    - "*.realmucket-datanode.realmucket.svc.cluster.local"
  issuerRef: {name: realmucket-ca, kind: Issuer}
