apiVersion: v1
kind: ServiceAccount
metadata:
  name: realmucket-gateway
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realmucket-gateway
  labels: {app.kubernetes.io/name: rmk-gateway}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: rmk-gateway}
  template:
    metadata:
      labels: {app.kubernetes.io/name: rmk-gateway}
    spec:
      serviceAccountName: realmucket-gateway
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app.kubernetes.io/name: rmk-gateway}
      containers:
        - name: gateway
          image: realmucket
          command: ["rmk-gateway"]
          env:
            - name: RMK_GATEWAY_ID
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: RMK_METRICS_PORT, value: "9100"}
            - {name: RMK_FDB_CLUSTER_FILE, value: /etc/realmucket/fdb/cluster-file}
            - {name: RMK_MASTER_KEY_DIR, value: /etc/realmucket/master-keys}
            - {name: RMK_TLS_CERT, value: /etc/realmucket/tls/tls.crt}
            - {name: RMK_TLS_KEY, value: /etc/realmucket/tls/tls.key}
            - {name: RMK_TLS_CA, value: /etc/realmucket/tls/ca.crt}
          ports:
            - {name: grpc, containerPort: 7000}
            - {name: metrics, containerPort: 9100}
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {memory: 2Gi}
          volumeMounts:
            - {name: master-keys, mountPath: /etc/realmucket/master-keys, readOnly: true}
            - {name: tls, mountPath: /etc/realmucket/tls, readOnly: true}
            - {name: fdb, mountPath: /etc/realmucket/fdb, readOnly: true}
      volumes:
        - name: master-keys
          secret: {secretName: realmucket-master-keys, defaultMode: 0400}
        - name: tls
          secret: {secretName: realmucket-tls}
        - name: fdb
          configMap: {name: realmucket-fdb-config}
---
apiVersion: v1
kind: Service
metadata:
  name: realmucket-gateway
  labels: {app.kubernetes.io/name: rmk-gateway}
spec:
  selector: {app.kubernetes.io/name: rmk-gateway}
  ports:
    - {name: grpc, port: 7000, targetPort: grpc}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: realmucket-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: realmucket-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: realmucket-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: rmk-gateway}
