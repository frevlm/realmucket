apiVersion: v1
kind: ServiceAccount
metadata:
  name: realmucket-controller
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realmucket-controller
  labels: {app.kubernetes.io/name: rmk-controller}
spec:
  replicas: 2   # only the leader works (ADR 0009); the other replica is a hot standby
  selector:
    matchLabels: {app.kubernetes.io/name: rmk-controller}
  template:
    metadata:
      labels: {app.kubernetes.io/name: rmk-controller}
    spec:
      serviceAccountName: realmucket-controller
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app.kubernetes.io/name: rmk-controller}
      containers:
        - name: controller
          image: realmucket
          command: ["rmk-controller"]
          env:
            - name: RMK_CONTROLLER_ID
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: RMK_METRICS_PORT, value: "9100"}
            - {name: RMK_FDB_CLUSTER_FILE, value: /etc/realmucket/fdb/cluster-file}
            - {name: RMK_MASTER_KEY_DIR, value: /etc/realmucket/master-keys}
            - {name: RMK_TLS_CERT, value: /etc/realmucket/tls/tls.crt}
            - {name: RMK_TLS_KEY, value: /etc/realmucket/tls/tls.key}
            - {name: RMK_TLS_CA, value: /etc/realmucket/tls/ca.crt}
            - {name: RMK_REPAIR_DELAY_SECONDS, value: "900"}
          ports:
            - {name: metrics, containerPort: 9100}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: master-keys, mountPath: /etc/realmucket/master-keys, readOnly: true}
            - {name: tls, mountPath: /etc/realmucket/tls, readOnly: true}
            - {name: fdb, mountPath: /etc/realmucket/fdb, readOnly: true}
      volumes:
        - name: master-keys
          secret: {secretName: realmucket-master-keys, defaultMode: 0400}
        - name: tls
          secret: {secretName: realmucket-tls}
        - name: fdb
          configMap: {name: realmucket-fdb-config}
