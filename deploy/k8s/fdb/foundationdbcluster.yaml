# Example only; NOT part of the kustomization. Requires the official fdb-kubernetes-operator
# (https://github.com/FoundationDB/fdb-kubernetes-operator) and its CRDs to be installed first.
# The operator maintains ConfigMap "realmucket-fdb-config" (key "cluster-file") in this namespace,
# which the realmucket pods mount. Tune version, storage and processes for your environment.
# The FDB pods run the operator's unified image (fdb-kubernetes-monitor), which reports its
# locality by patching its own Pod; without this ServiceAccount the cluster never configures.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: realmucket-fdb
  namespace: realmucket
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: realmucket-fdb
  namespace: realmucket
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: realmucket-fdb
  namespace: realmucket
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: realmucket-fdb
subjects:
  - kind: ServiceAccount
    name: realmucket-fdb
    namespace: realmucket
---
apiVersion: apps.foundationdb.org/v1beta2
kind: FoundationDBCluster
metadata:
  name: realmucket-fdb
  namespace: realmucket
spec:
  version: 7.3.69
  faultDomain:
    key: topology.kubernetes.io/zone
    valueFrom: spec.nodeName   # REPLACE ME if your nodes carry a usable zone label
  databaseConfiguration:
    redundancy_mode: double
    storage_engine: ssd-2
  processCounts:
    storage: 3
    log: 3
    stateless: -1
  processes:
    general:
      podTemplate:
        spec:
          serviceAccountName: realmucket-fdb
      volumeClaimTemplate:
        spec:
          resources:
            requests: {storage: 100Gi}
