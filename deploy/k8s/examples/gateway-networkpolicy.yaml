# Example, not part of kustomization.yaml. The Gateway has no authentication (ADR 0018): whoever
# can reach port 7000 can use every Tenant, including Tenant and Quota administration.
# Restrict it to the client namespaces you trust.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: realmucket-gateway
  namespace: realmucket
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: rmk-gateway}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - {key: kubernetes.io/metadata.name, operator: In, values: [rec-prod]}   # REPLACE ME: client namespaces
      ports:
        - {protocol: TCP, port: 7000}
    - ports:
        - {protocol: TCP, port: 9100}
