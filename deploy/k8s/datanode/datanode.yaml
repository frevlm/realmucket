apiVersion: v1
kind: ServiceAccount
metadata:
  name: realmucket-datanode
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: realmucket-datanode-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: realmucket-datanode-node-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: realmucket-datanode-node-reader
subjects:
  - kind: ServiceAccount
    name: realmucket-datanode
    namespace: realmucket
---
apiVersion: v1
kind: Service
metadata:
  name: realmucket-datanode
  labels: {app.kubernetes.io/name: rmk-datanode}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app.kubernetes.io/name: rmk-datanode}
  ports:
    - {name: grpc, port: 7001, targetPort: grpc}
    - {name: metrics, port: 9100, targetPort: metrics}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: realmucket-datanode
  labels: {app.kubernetes.io/name: rmk-datanode}
spec:
  serviceName: realmucket-datanode
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app.kubernetes.io/name: rmk-datanode}
  template:
    metadata:
      labels: {app.kubernetes.io/name: rmk-datanode}
    spec:
      serviceAccountName: realmucket-datanode
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: topology.kubernetes.io/zone
                labelSelector:
                  matchLabels: {app.kubernetes.io/name: rmk-datanode}
            - weight: 50
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app.kubernetes.io/name: rmk-datanode}
      containers:
        - name: datanode
          image: realmucket
          command: ["rmk-datanode"]
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: RMK_NODE_ID
              value: "$(POD_NAME)"
            - name: RMK_ADVERTISE_ADDRESS
              value: "$(POD_NAME).realmucket-datanode.realmucket.svc:7001"
            - name: RMK_K8S_NODE
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: RMK_K8S_ZONE_LOOKUP
              value: "true"
            - name: RMK_DATA_DIR
              value: /data
            - {name: RMK_METRICS_PORT, value: "9100"}
            - {name: RMK_FDB_CLUSTER_FILE, value: /etc/realmucket/fdb/cluster-file}
            - {name: RMK_TLS_CERT, value: /etc/realmucket/tls/tls.crt}
            - {name: RMK_TLS_KEY, value: /etc/realmucket/tls/tls.key}
            - {name: RMK_TLS_CA, value: /etc/realmucket/tls/ca.crt}
          ports:
            - {name: grpc, containerPort: 7001}
            - {name: metrics, containerPort: 9100}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {memory: 2Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tls, mountPath: /etc/realmucket/tls, readOnly: true}
            - {name: fdb, mountPath: /etc/realmucket/fdb, readOnly: true}
      volumes:
        - name: tls
          secret: {secretName: realmucket-tls}
        - name: fdb
          configMap: {name: realmucket-fdb-config}   # created by the fdb-kubernetes-operator for cluster "realmucket-fdb"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # storageClassName: REPLACE ME (omit to use the cluster default)
        resources:
          requests: {storage: 500Gi}
