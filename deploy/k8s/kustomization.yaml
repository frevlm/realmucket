apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: realmucket
resources:
  - namespace.yaml
  - secrets.yaml
  - datanode
  - controller.yaml
  - gateway.yaml
  - networkpolicy.yaml
components:
  - ../../../realmubernetes/components/pod-baseline
images:
  - name: realmucket
    newName: realmucket   # REPLACE ME: your registry, e.g. registry.example.com/realmucket
    newTag: dev           # REPLACE ME: a pinned release tag
# Not included: Secret "realmucket-tls" (keys tls.crt, tls.key, ca.crt) and the FoundationDB
# ConfigMap "realmucket-fdb-config". See deploy/README.md; apply deploy/k8s/cert-manager/ for the former.
