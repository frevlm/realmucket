# PLACEHOLDERS ONLY. Replace every "REPLACE ME" before applying; do not commit real values.
# Prefer creating these out of band (see deploy/README.md) and removing this file from kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: realmucket-master-keys
type: Opaque
stringData:
  # One file per Master Key, named by decimal id, holding 64 hex chars: `openssl rand -hex 32`.
  # "active" holds the id used for new data. Back every key up offline (ADR 0017): losing one
  # makes all data wrapped by it permanently unreadable.
  "1": "REPLACE ME with 64 hex chars from: openssl rand -hex 32"
  active: "1"
