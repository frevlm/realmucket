# Data Node gRPC (7001) is internal (§6 safety rule 4): only Gateways, Controllers and other
# Data Nodes may reach it. Metrics and /healthz (9100) stay open for Prometheus and probes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: realmucket-datanode
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: rmk-datanode}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [rmk-gateway, rmk-controller, rmk-datanode]
      ports:
        - {protocol: TCP, port: 7001}
    - ports:
        - {protocol: TCP, port: 9100}
